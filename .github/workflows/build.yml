name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Add Go bin to PATH
        run: echo "$env:USERPROFILE\go\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install NSIS (for Windows installer)
        run: choco install nsis -y --no-progress
        if: runner.os == 'Windows'

      - name: Build & Package
        run: wails3 package

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: eyefoo-windows-installer
          path: build/windows/nsis/eyefoo-installer.exe

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: eyefoo-windows-exe
          path: bin/eyefoo.exe
