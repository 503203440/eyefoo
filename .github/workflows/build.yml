name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # 用于在 tag 触发时创建 GitHub Release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Add Go bin to PATH
        run: echo "$env:USERPROFILE\go\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install NSIS (for Windows installer)
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build & Package
        run: wails3 package

      - name: List build outputs
        run: Get-ChildItem -Recurse bin/

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: eyefoo-windows
          path: |
            bin/eyefoo-amd64-installer.exe
            bin/eyefoo.exe
          if-no-files-found: warn

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Add Go bin to PATH
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build & Package (universal: arm64 + amd64)
        run: wails3 task darwin:package:universal

      - name: List build outputs
        run: ls -laR bin/

      - name: Zip .app bundle
        run: |
          cd bin
          zip -r eyefoo-macos-universal.zip eyefoo.app

      - name: Verify universal binary
        run: lipo -info bin/eyefoo.app/Contents/MacOS/eyefoo

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: eyefoo-macos
          path: bin/eyefoo-macos-universal.zip
          if-no-files-found: warn

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: eyefoo-windows
          path: artifacts/windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: eyefoo-macos
          path: artifacts/macos

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows/eyefoo-amd64-installer.exe
            artifacts/windows/eyefoo.exe
            artifacts/macos/eyefoo-macos-universal.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
